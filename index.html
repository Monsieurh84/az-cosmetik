<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D5A4D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231D5A4D%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27%3EAZ%3C/text%3E%3C/svg%3E">
<title>Atelier AZ Cosmétik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concept : l'établi d'un façonnier de parfum. Verre de flacon (vert bouteille), ambre du jus, porcelaine du labo.
   Chaque projet se lit comme un ordre de fabrication : référence, kilos de concentré, composants qui voyagent jusqu'au conditionneur. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE8; --ink:#15211E; --mute:#5A6964; --line:#D7DDD8;
  --glass:#1D5A4D; --glass-ink:#FFFFFF; --glass-soft:#DCEAE5;
  --amber:#B4712A; --amber-soft:#F5E6D2;
  --ok:#2E7A4E; --ok-soft:#DDF0E3; --warn:#B45309; --warn-soft:#FCEBD5; --stop:#B42318; --stop-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(21,33,30,.06),0 8px 24px rgba(21,33,30,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E6ECE9; --mute:#9AA9A3; --line:#29352F;
  --glass:#62B8A2; --glass-ink:#0B1311; --glass-soft:#183530;
  --amber:#E1A55E; --amber-soft:#3A2B18;
  --ok:#5CC28A; --ok-soft:#173226; --warn:#F0A04B; --warn-soft:#3A2913; --stop:#F07167; --stop-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E6ECE9; --mute:#9AA9A3; --line:#29352F;
  --glass:#62B8A2; --glass-ink:#0B1311; --glass-soft:#183530;
  --amber:#E1A55E; --amber-soft:#3A2B18;
  --ok:#5CC28A; --ok-soft:#173226; --warn:#F0A04B; --warn-soft:#3A2913; --stop:#F07167; --stop-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-weight:600;letter-spacing:.02em}
.tnum{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.i{width:18px;height:18px;flex:none}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--glass);color:var(--glass-ink);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo .mk{width:38px;height:38px;border-radius:10px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo b{font-family:var(--f-display);font-size:19px;display:block;line-height:1}
.logo small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:9px;padding:9px 10px;text-align:left;font-weight:600;color:inherit;opacity:.82}
.nav button:hover{opacity:1;background:color-mix(in srgb,var(--glass-ink) 10%,transparent)}
.nav button[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--glass-ink) 16%,transparent)}
.nav .ct{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--amber);color:#fff;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:0 6px}
.side .foot button{background:transparent;border:1px solid currentColor;border-radius:8px;padding:6px 9px;color:inherit;font-size:12px;margin-top:8px}

.main{min-width:0;padding-block:18px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px 10px 38px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:360px;overflow:auto;padding:6px}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-left:auto}
.demo{font-size:12.5px;color:var(--mute);background:var(--amber-soft);border-radius:999px;padding:5px 11px}

/* ===== Common ===== */
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(28px,3.4vw,40px);font-weight:800}
.head p{margin:4px 0 0;color:var(--mute)}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--glass);border-color:var(--glass);color:var(--glass-ink)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-stop{background:var(--stop-soft);color:var(--stop)}
.p-glass{background:var(--glass-soft);color:var(--glass)}.p-amb{background:var(--amber-soft);color:var(--amber)}.p-mute{background:var(--surface-2);color:var(--mute)}
.ref{font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.03em;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2);white-space:nowrap}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none;display:inline-block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.sec{margin-top:24px}
.sec>h2{font-size:21px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.sec>h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.art{display:flex;align-items:center;gap:9px;min-width:0}
.art b{display:block;font-weight:600}
.art small{color:var(--mute)}

/* KPI */
.kpi .v{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1;margin-top:8px}
.kpi .s{font-size:13px;color:var(--mute);margin-top:4px}

/* Alerts */
.todo{display:grid;gap:8px}
.todo button{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px}
.todo button:hover{border-color:var(--mute)}
.todo .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.todo b{display:block;font-weight:600}
.todo small{color:var(--mute)}
.d-stop{background:var(--stop)}.d-warn{background:var(--warn)}.d-glass{background:var(--glass)}

/* Pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:14px;font-family:var(--f-body);font-weight:700;display:flex;justify-content:space-between}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;width:100%}
.mini:hover{border-color:var(--glass)}
.mini b{display:block;font-size:14px}
.mini small{color:var(--mute);font-size:12.5px}

/* Project cards */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:10px;width:100%}
.pcard:hover{border-color:var(--glass);box-shadow:var(--shadow)}
.pcard h3{font-size:21px}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.steps i{height:5px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:var(--glass)}
.steps i.now{background:var(--amber)}
.gauge{display:flex;align-items:center;gap:8px;font-size:13px}
.gauge .bar{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--glass);border-radius:4px}
.gauge .bar i.full{background:var(--ok)}

/* Project detail */
.back{border:0;background:transparent;color:var(--mute);font-weight:600;padding:0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.phead h1{font-size:clamp(30px,4vw,46px);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;color:var(--mute);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.valid-ref{border:1.5px solid var(--ok);border-radius:12px;padding:10px 14px;background:var(--ok-soft);min-width:220px}
.valid-ref.none{border-color:var(--warn);background:var(--warn-soft)}
.valid-ref .mono{font-size:20px;display:block;margin-top:2px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}
.stepper button{border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.stepper button i{height:6px;border-radius:3px;background:var(--surface-2);display:block}
.stepper button.on{color:var(--ink)}.stepper button.on i{background:var(--glass)}
.stepper button.now{color:var(--amber)}.stepper button.now i{background:var(--amber)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--mute);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--glass)}
.kit{display:grid;gap:6px}
.kit div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:14px}
.kit div.ok{background:var(--ok-soft)}
.kit .st{margin-left:auto;font-size:12.5px;font-weight:700}
.kit div.ok .st{color:var(--ok)}
.kit div.ko .st{color:var(--warn)}

/* Supply track */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;min-width:180px}
.track i{height:6px;border-radius:3px;background:var(--surface-2)}
.track i.on{background:var(--glass)}
.track i.done{background:var(--ok)}
.trk-l{font-size:12.5px;font-weight:600;margin-top:5px;display:block}

/* Jus */
.kg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kg .v{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;margin-top:6px}
.kg .v small{font-size:15px;font-family:var(--f-body);color:var(--mute);font-weight:600}
.formula{font-family:var(--f-mono);font-size:12.5px;color:var(--mute);margin-top:8px}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--amber)}
.prog i.full{background:var(--ok)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.f input,.f select,.f textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--glass)}

/* Journal */
.notes{display:grid;gap:10px}
.note{border-left:3px solid var(--amber);padding:4px 0 4px 12px}
.note small{color:var(--mute);font-size:12.5px}
.note p{margin:3px 0 0}
.tasks{display:grid;gap:6px}
.tasks label{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:9px;background:var(--surface-2);cursor:pointer}
.tasks input{width:18px;height:18px;accent-color:var(--glass);margin-top:1px;flex:none}
.tasks label.done span{text-decoration:line-through;color:var(--mute)}
.rdv{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rdv:last-child{border-bottom:0}
.cal{width:52px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal span{display:block;background:var(--glass);color:var(--glass-ink);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-family:var(--f-display);font-size:20px;padding:2px 0 3px}
.rdv .t{min-width:0}
.rdv .t b{display:block}
.rdv .t small{color:var(--mute)}

.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:14px 0 10px;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend small{color:var(--mute)}
.money>div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.money b{font-family:var(--f-display);font-size:20px}
.money .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.money .bar i{display:block;height:100%}
input.pu{width:88px;border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
input.pay{width:18px;height:18px;accent-color:var(--ok)}
.tbl tfoot td{border-top:2px solid var(--ink);border-bottom:0}
.vs{display:grid;gap:3px}
.vs i{display:block;height:7px;border-radius:4px}
.vs .ca{background:var(--glass-soft);outline:1px solid var(--glass)}
.vs .cr{background:var(--glass)}

.h2{font-size:21px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--mute)}
.welcome{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;background:var(--glass-soft);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.welcome b{font-family:var(--f-display);font-size:17px}
.welcome ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:14.5px}
.welcome li{display:flex;gap:10px;align-items:baseline}
.welcome li span{width:22px;height:22px;flex:none;border-radius:50%;background:var(--glass);color:var(--glass-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.nexts{display:grid;gap:8px}
.next{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.next.wait{border-left-color:var(--line)}
.next.site{border-left-color:var(--glass);background:var(--glass-soft)}
.phead + .stepper + .next, .stepper + .next{margin:0 0 16px}
.nx-t{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.nx-t b{font-size:15.5px}
.nx-t small{color:var(--mute)}
.nx-p{border:0;background:transparent;padding:0;text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--glass)}
.nx-p small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--mute)}
.pc-next{font-size:13.5px;font-weight:600;color:var(--amber);border-top:1px dashed var(--line);padding-top:8px}
.lm{border:1.5px dashed var(--glass);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.lm p{margin:0;font-size:14px}
.lm-r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lm-r span{display:grid}
.lm-r small{color:var(--mute)}

/* Modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,16,14,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{font-size:24px;margin-bottom:12px}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .end{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.22s;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:11px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.contacts ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.contacts li{font-size:14px}
.contacts li small{display:block;color:var(--mute)}

/* Mobile */
.mnav{display:none}

const byId = (arr, id) => arr.find(x => x.id === id);

const proj = id => byId(S.projets, id);
const need = p => p.qte * p.vol * (p.conc / 100) * 0.9 / 1000;
const valid = p => p.formules.find(f => f.statut === 'validee');
function kit(p) {
  const v = valid(p), n = need(p);
  const items = [{ label: 'Concentré ' + (v ? v.ref : '(aucune formule validée)'), ok: !!v && p.jus.kgLivre >= n - 0.001, st: v ? kg(p.jus.kgLivre) + ' / ' + kg(n) : 'à valider' }];
  p.lignes.forEach(l => { const a = art(l.art); items.push({ label: a.nom, sw: a.sw, ok: l.st === 5, st: LST[l.st].n }); });
  return { items, ok: items.filter(i => i.ok).length, total: items.length };
}
const active = () => S.projets.filter(p => p.etape < 4);

/* ===================== Alertes ===================== */
function alerts() {
  const out = [];
  active().forEach(p => {
    const v = valid(p), n = need(p), c = ct(p.client).nom;
    if (!v && p.etape >= 1 && days(p.echeance) <= 45) out.push({ s: 'warn', p: p.id, t: `${p.nom} : aucune formule validée`, d: `${c} · ${p.formules.filter(f => f.statut === 'essai').length} essai(s) en cours · échéance ${rel(p.echeance)}` });
    if (v && p.etape >= 2 && p.jus.kgLivre < n - 0.001) out.push({ s: p.etape >= 3 ? 'stop' : 'warn', p: p.id, t: `${p.nom} : il manque ${kg(n - p.jus.kgLivre)} de concentré chez le conditionneur`, d: `${v.ref} · ${kg(p.jus.kgLivre)} livrés sur ${kg(n)} · commandé par ${p.jus.par === 'az' ? 'AZ Cosmétik' : 'le client'}` });
    const ac = p.lignes.filter(l => l.st === 0);
    if (ac.length && p.etape >= 1) out.push({ s: 'warn', p: p.id, t: `${p.nom} : ${ac.length} composant${ac.length > 1 ? 's' : ''} à commander`, d: ac.map(l => art(l.art).nom).join(', ') });
    const at = p.lignes.filter(l => l.st === 3);
    if (at.length && p.etape >= 2) out.push({ s: 'glass', p: p.id, t: `${p.nom} : ${at.length} composant${at.length > 1 ? 's' : ''} à envoyer au conditionneur`, d: at.map(l => art(l.art).nom).join(', ') + ' · à l’atelier' });
  });
  S.commandes.filter(o => o.st !== 'recue' && days(o.eta) < 0).forEach(o => out.push({ s: 'stop', o: o.id, t: `Commande ${o.num} en retard de ${-days(o.eta)} j`, d: `${ct(o.four).nom} · ${o.lignes.map(l => num(l.qte) + ' × ' + art(l.art).nom).join(', ')}` }));
  const low = S.articles.filter(a => a.seuil && a.libre < a.seuil);
  if (low.length) out.push({ s: 'warn', st: 1, t: `Stock bas : ${low.length} article${low.length > 1 ? 's' : ''} sous le seuil`, d: low.map(a => `${a.nom} (${num(a.libre)})`).join(', ') });
  const ord = { stop: 0, warn: 1, glass: 2 };
  return out.sort((a, b) => ord[a.s] - ord[b.s]);
}

  render(); window.scrollTo(0, 0);
}

function nextAction(p) {

  if (p.etape === 0 && !p.formules.length) return { t: 'Envoyer le brief au nez', d: 'Ajoutez la première formule dès que le nez vous l’envoie.', b: 'Ajouter une formule', a: ['tab', 'jus'] };
  if (!v) return { t: p.formules.length ? 'Choisir la formule validée' : 'Ajouter la première formule', d: p.formules.length ? p.formules.length + ' formule(s) en test. Validez celle retenue par ' + cn + '.' : 'Rien reçu du nez pour l’instant.', b: p.formules.length ? 'Voir les formules' : 'Ajouter une formule', a: ['tab', 'jus'] };
  const l0 = p.lignes.find(l => l.st === 0); if (l0) return { t: 'Commander : ' + art(l0.art).nom, d: num(l0.qte) + ' pièces pour ' + cn + ' · ' + ct(art(l0.art).four).nom, b: 'Commander', a: ['order', l0.id] };
  if (p.jus.kgLivre < n - 0.001) return { t: 'Concentré ' + v.ref + ' : il manque ' + kg(n - p.jus.kgLivre), d: 'Notez la livraison chez ' + (p.cond ? ct(p.cond).nom : 'le conditionneur') + ' dès qu’elle est faite.', b: 'Noter une livraison', a: ['tab', 'jus'] };
  const l3 = p.lignes.find(l => l.st === 3); if (l3) return { t: 'Envoyer au conditionneur : ' + art(l3.art).nom, d: num(l3.qte) + ' pièces sont à l’atelier.', b: 'C’est envoyé', a: ['adv', l3.id] };
  const l4 = p.lignes.find(l => l.st === 4); if (l4) return { t: 'Le conditionneur a-t-il reçu : ' + art(l4.art).nom + ' ?', d: 'Confirmez quand ' + (p.cond ? ct(p.cond).nom : 'il') + ' vous le dit.', b: 'Oui, c’est reçu', a: ['adv', l4.id] };
  const l12 = p.lignes.find(l => l.st === 1 || l.st === 2); if (l12) { const o = l12.cmd && byId(S.commandes, l12.cmd); return { t: 'En attente : ' + art(l12.art).nom, d: o ? 'Arrivée prévue ' + fd(o.eta) + ' (' + rel(o.eta) + ')' : 'Commande en cours', b: 'C’est arrivé', a: ['recv', l12.id], wait: true }; }

}
function runAction(p, a) {
  const [k, x] = a;
  if (k === 'tab') { ptab = x; cur = p.id; route = 'projet'; return go('projet-' + p.id); }
  if (k === 'order') return orderModal(p, p.lignes.find(l => l.id === x));
  if (k === 'adv') return advance(p, p.lignes.find(l => l.id === x));
  if (k === 'recv') { const l = p.lignes.find(z => z.id === x); l.st = 2; return advance(p, l); }
  if (k === 'etape') { p.etape = x; p.notes.unshift({ d: TODAY, t: 'Étape : ' + ETAPES[x] + '.' }); save(); toast(x === 4 ? 'Projet livré. Bravo !' : 'Production lancée'); return render(); }

}

}
const actionCard = (p, compact) => { const a = nextAction(p); if (!a) return ''; return `<div class="next ${a.wait ? 'wait' : ''} ${a.a[0] === 'site' ? 'site' : ''}">

const eur = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const eur0 = n => Math.round(n).toLocaleString('fr-FR') + ' €';
const CATS = [['Concentré', 'var(--amber)'], ['Flacons', '#5E8C82'], ['Pompes et capots', '#9AA7A2'], ['Packaging', '#B98F5B'], ['Création', '#7C6A9E'], ['Conditionnement', 'var(--glass)'], ['Transport', '#C26B4F']];
const catOf = a => a.type === 'Flacon' ? 'Flacons' : (a.type === 'Pompe' || a.type === 'Capot') ? 'Pompes et capots' : 'Packaging';
function costs(p) {
  const c = p.chiffrage, rows = [];
  const kgJ = Math.max(p.jus.kgCmd, need(p));
  if (c.jusKg > 0) rows.push({ k: 'jus', lib: 'Concentré ' + (valid(p) ? valid(p).ref : ''), cat: 'Concentré', q: kgJ, unit: 'kg', pu: c.jusKg, tot: kgJ * c.jusKg, paye: c.jusPaye });
  p.lignes.forEach(l => { const a = art(l.art); rows.push({ k: 'l', id: l.id, lib: a.nom, cat: catOf(a), q: l.qte, unit: 'pcs', pu: l.pu || 0, tot: l.qte * (l.pu || 0), paye: !!l.paye, sw: a.sw }); });
  c.frais.forEach(f => rows.push({ k: 'f', id: f.id, lib: f.lib, cat: f.cat, q: f.mode === 'u' ? p.qte : 1, unit: f.mode === 'u' ? 'pcs' : 'forfait', pu: f.montant, tot: (f.mode === 'u' ? p.qte : 1) * f.montant, paye: !!f.paye }));
  const total = rows.reduce((s, r) => s + r.tot, 0), paye = rows.filter(r => r.paye).reduce((s, r) => s + r.tot, 0);
  const ca = c.pv * p.qte, marge = ca - total;
  return { rows, total, paye, ca, marge, taux: ca ? marge / ca * 100 : 0, unit: p.qte ? total / p.qte : 0, coef: total ? ca / total : 0 };
}
function breakdown(rows, total) {

  return `<div class="stack" role="img" aria-label="Répartition du coût de revient">${by.map(([n, col, v]) => `<i style="width:${v / total * 100}%;background:${col}" title="${n} : ${eur0(v)}"></i>`).join('')}</div>
    <div class="legend">${by.map(([n, col, v]) => `<span><i style="background:${col}"></i>${n} <b class="tnum">${eur0(v)}</b> <small>${Math.round(v / total * 100)} %</small></span>`).join('')}</div>`;
}

function vChiffrage() {

    <div class="card kpi"><div class="lbl">Encaissé</div><div class="v tnum" style="font-size:30px">${eur0(enc)}</div><div class="s">reste ${eur0(Math.max(0, ca - enc))} à facturer</div></div>

  const r = { res: 0, cmd: 0, cond: 0 };
  S.projets.forEach(p => p.lignes.filter(l => l.art === a.id).forEach(l => { if (l.st === 1 || l.st === 2) r.cmd += l.qte; else if (l.st === 3) r.res += l.qte; else if (l.st >= 4 && p.etape < 4) r.cond += l.qte; }));
  return r;
}

        <table class="tbl"><tbody><tr><td><div class="art"><span class="sw" style="background:var(--amber)"></span><div><b>Concentré ${v ? E(v.ref) : '(non validé)'}</b><small>${p.jus.par === 'az' ? 'commandé par AZ' : 'commandé par le client'}</small></div></div></td><td class="n">${kg(p.jus.kgLivre)} / ${kg(n)}</td><td><span class="pill ${v && p.jus.kgLivre >= n - 0.001 ? 'p-ok' : 'p-warn'}">${v && p.jus.kgLivre >= n - 0.001 ? 'Chez le conditionneur' : 'Incomplet'}</span></td></tr>

/* ===================== Agenda ===================== */
function upcoming() {
  const out = [];
  S.projets.forEach(p => {
    p.rdv.forEach(r => out.push({ kind: 'rdv', d: r.d, h: r.h, t: r.t, s: `${p.nom} · ${ct(p.client).nom} · ${r.lieu}`, p: p.id }));
    if (p.etape < 4) out.push({ kind: 'ech', d: p.echeance, h: '', t: 'Échéance : ' + p.nom, s: `${ct(p.client).nom} · ${num(p.qte)} × ${p.vol} ml · étape ${ETAPES[p.etape]}`, p: p.id });
  });
  S.commandes.filter(o => o.st !== 'recue').forEach(o => out.push({ kind: 'eta', d: o.eta, h: '', t: 'Arrivée ' + o.num, s: `${ct(o.four).nom} · ${o.lignes.map(l => num(l.qte) + ' × ' + art(l.art).nom).join(', ')}`, o: o.id }));
  return out.filter(x => days(x.d) >= -1).sort((a, b) => (a.d + a.h).localeCompare(b.d + b.h));
}
const KIND = { rdv: ['Rendez-vous', 'p-glass'], ech: ['Échéance', 'p-amb'], eta: ['Livraison', 'p-mute'] };
const agendaList = (list, max) => list.slice(0, max || 99).map(x => `<div class="rdv">${cal(x.d)}<div class="t" style="flex:1"><b>${E(x.t)}</b><small>${x.h ? E(x.h) + ' · ' : ''}${E(x.s)}</small></div>${x.p ? `<button class="btn sm ghost" data-p="${x.p}">Ouvrir</button>` : `<button class="btn sm ghost" data-nav="commandes">Voir</button>`}</div>`).join('');
function vAgenda() {
  const up = upcoming();
  const groups = [['Cette semaine', x => days(x.d) <= 7], ['Les 3 semaines suivantes', x => days(x.d) > 7 && days(x.d) <= 28], ['Plus tard', x => days(x.d) > 28]];
  $('#view').innerHTML = `<div class="head"><div><h1>Agenda</h1><p>Rendez-vous clients, échéances des projets et arrivées des commandes, au même endroit.</p></div></div>
    ${groups.map(([g, f]) => { const l = up.filter(f); return l.length ? `<div class="sec" style="margin-top:14px"><h2 style="font-size:19px;margin-bottom:8px">${g}</h2><div class="card">${l.map(x => `<div class="rdv">${cal(x.d)}<div class="t" style="flex:1"><b>${E(x.t)}</b><small>${x.h ? E(x.h) + ' · ' : ''}${E(x.s)}</small></div><span class="pill ${KIND[x.kind][1]}">${KIND[x.kind][0]}</span>${x.p ? `<button class="btn sm ghost" data-p="${x.p}">Ouvrir</button>` : ''}</div>`).join('')}</div></div>` : ''; }).join('')}`;
}

/* ===================== Modal, toast, reset ===================== */
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; const f = m.querySelector('input:not([readonly]),select'); if (f) f.focus(); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
